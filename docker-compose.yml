services:
  atproto_oauth:
    container_name: atproto_oauth
    build:
      context: .
      dockerfile: Dockerfile
    image: atproto_oauth:latest
    restart: unless-stopped
    ports:
      - "3065:3000"
    volumes:
      - atproto_oauth_data:/app/data
    environment:
      - PUBLIC_URL=https://test_alias.bstools.co.uk
      - DATABASE_PATH=/app/data/app.db
networks:
  default:
    name: atproto_oauth_network
volumes:
  atproto_oauth_data:
    name: atproto_oauth_data